<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f4ff 0%, #f9e8ff 50%, #fff4e0 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #2d2d3a;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.4rem;
      letter-spacing: 2px;
      color: #c0398a;
    }

    #subtitle {
      font-size: 0.85rem;
      color: #8a7a9b;
      margin-bottom: 1.8rem;
      letter-spacing: 1px;
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 0.6rem;
      min-height: 1.6rem;
      color: #4a6fa5;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ── Timer ── */
    #timer-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 1.4rem;
    }

    #timer-bar-bg {
      width: 160px;
      height: 8px;
      background: #d5c9e8;
      border-radius: 4px;
      overflow: hidden;
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: #7bbfea;
      border-radius: 4px;
      transition: width 0.9s linear, background 0.3s;
    }

    #timer-bar.warning {
      background: #e94560;
    }

    #timer-label {
      min-width: 2.2rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #4a6fa5;
    }

    #timer-label.warning {
      color: #e94560;
    }

    /* ── Board ── */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 10px;
      perspective: 600px;
    }

    .cell {
      position: relative;
      background: linear-gradient(145deg, #ffffff, #e8dff5);
      border: 2px solid #c9b8e8;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      cursor: pointer;
      user-select: none;
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s;
      box-shadow:
        4px 6px 14px rgba(160,130,200,0.3),
        -2px -2px 6px rgba(255,255,255,0.8),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* shiny top edge */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(255,255,255,0.7) 0%, transparent 55%);
      pointer-events: none;
    }

    .cell:hover:not(.taken) {
      transform: translateY(-6px) rotateX(8deg) scale(1.06);
      box-shadow:
        8px 16px 28px rgba(140,100,200,0.35),
        -2px -2px 8px rgba(255,255,255,0.9),
        inset 0 1px 0 rgba(255,255,255,1),
        0 0 20px rgba(192,57,138,0.2);
      background: linear-gradient(145deg, #fff0fb, #ead5f5);
      border-color: #c0398a;
    }

    /* wiggle on hover */
    .cell:hover:not(.taken) {
      animation: wiggle 0.35s ease forwards;
    }

    @keyframes wiggle {
      0%   { transform: translateY(-6px) rotateX(8deg) scale(1.06) rotateZ(0deg); }
      25%  { transform: translateY(-6px) rotateX(8deg) scale(1.06) rotateZ(-2deg); }
      75%  { transform: translateY(-6px) rotateX(8deg) scale(1.06) rotateZ(2deg); }
      100% { transform: translateY(-6px) rotateX(8deg) scale(1.06) rotateZ(0deg); }
    }

    .cell.taken {
      cursor: default;
    }

    /* drop-in animation when a piece is placed */
    @keyframes dropIn {
      0%   { transform: translateY(-30px) scale(0.4); opacity: 0; }
      60%  { transform: translateY(4px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .cell.placed {
      animation: dropIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    .cell.win {
      background: linear-gradient(145deg, #fff0c8, #ffe8a0);
      border-color: #f0a020;
      box-shadow:
        0 0 22px rgba(240,160,32,0.5),
        4px 6px 14px rgba(160,130,50,0.3);
      animation: winPulse 0.6s ease;
    }

    @keyframes winPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12) rotateZ(-3deg); }
      70%  { transform: scale(1.08) rotateZ(2deg); }
      100% { transform: scale(1) rotateZ(0deg); }
    }

    /* ── Controls ── */
    #controls {
      margin-top: 1.6rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.55rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    #btn-restart {
      background: #c0398a;
      color: #fff;
      box-shadow: 0 3px 10px rgba(192,57,138,0.35);
    }

    #btn-toggle {
      background: #fff;
      color: #4a6fa5;
      border: 2px solid #7bbfea;
      box-shadow: 0 3px 10px rgba(74,111,165,0.15);
    }

    /* ── Scores ── */
    #scores {
      margin-top: 1.4rem;
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
      color: #8a7a9b;
    }

    #scores span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    #scores strong {
      font-size: 1.3rem;
      color: #2d2d3a;
    }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <p id="subtitle">You (🍦) vs. AI (🐸) — Minimax</p>

  <div id="status">Your turn — pick a square</div>

  <div id="timer-wrap">
    <div id="timer-bar-bg"><div id="timer-bar"></div></div>
    <span id="timer-label">15</span>s
  </div>

  <div id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div id="controls">
    <button id="btn-restart">Restart</button>
    <button id="btn-toggle">Go Second</button>
  </div>

  <div id="scores">
    <span>You 🍦 <strong id="score-x">0</strong></span>
    <span>Draws <strong id="score-d">0</strong></span>
    <span>AI 🐸 <strong id="score-o">0</strong></span>
  </div>

  <script>
    const HUMAN = 'X';
    const AI    = 'O';
    const HUMAN_EMOJI = '🍦';
    const AI_EMOJI    = '🐸';
    const MOVE_TIME   = 15; // seconds per turn

    const WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill(null);
    let gameOver = false;
    let humanGoesFirst = true;
    let scores = { X: 0, O: 0, D: 0 };

    // timer state
    let timerInterval = null;
    let timeLeft = MOVE_TIME;

    const cells      = document.querySelectorAll('.cell');
    const status     = document.getElementById('status');
    const btnToggle  = document.getElementById('btn-toggle');
    const timerBar   = document.getElementById('timer-bar');
    const timerLabel = document.getElementById('timer-label');

    // ── Timer ────────────────────────────────────────────
    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = MOVE_TIME;
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // auto-pick a random empty square for the human
          const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);
          if (empty.length) {
            const i = empty[Math.floor(Math.random() * empty.length)];
            board[i] = HUMAN;
            renderBoard(i);
            const result = checkWinner(board);
            if (result) { endGame(result); return; }
            aiTurn();
          }
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerBar.style.width = '0%';
      timerLabel.textContent = '';
      timerBar.classList.remove('warning');
      timerLabel.classList.remove('warning');
    }

    function updateTimerUI() {
      const pct = (timeLeft / MOVE_TIME) * 100;
      timerBar.style.width = pct + '%';
      timerLabel.textContent = timeLeft;
      const warn = timeLeft <= 5;
      timerBar.classList.toggle('warning', warn);
      timerLabel.classList.toggle('warning', warn);
    }

    // ── Game logic ───────────────────────────────────────
    function checkWinner(b) {
      for (const [a, i, c] of WIN_LINES) {
        if (b[a] && b[a] === b[i] && b[a] === b[c]) return { winner: b[a], line: [a, i, c] };
      }
      if (b.every(v => v)) return { winner: 'draw', line: [] };
      return null;
    }

    function minimax(b, isMaximising, alpha, beta) {
      const result = checkWinner(b);
      if (result) {
        if (result.winner === AI)    return  10;
        if (result.winner === HUMAN) return -10;
        return 0;
      }
      if (isMaximising) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = AI;
            best = Math.max(best, minimax(b, false, alpha, beta));
            b[i] = null;
            alpha = Math.max(alpha, best);
            if (beta <= alpha) break;
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = HUMAN;
            best = Math.min(best, minimax(b, true, alpha, beta));
            b[i] = null;
            beta = Math.min(beta, best);
            if (beta <= alpha) break;
          }
        }
        return best;
      }
    }

    function bestMove(b) {
      let best = -Infinity, move = -1;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = AI;
          const score = minimax(b, false, -Infinity, Infinity);
          b[i] = null;
          if (score > best) { best = score; move = i; }
        }
      }
      return move;
    }

    function renderBoard(newIndex = -1) {
      cells.forEach((cell, i) => {
        const val = board[i];
        cell.textContent = val === HUMAN ? HUMAN_EMOJI : val === AI ? AI_EMOJI : '';
        cell.className = 'cell' + (val ? ' taken' : '') + (i === newIndex ? ' placed' : '');
      });
    }

    function endGame(result) {
      gameOver = true;
      stopTimer();
      if (result.winner === 'draw') {
        status.textContent = "It's a draw!";
        scores.D++;
        document.getElementById('score-d').textContent = scores.D;
      } else {
        result.line.forEach(i => cells[i].classList.add('win'));
        if (result.winner === HUMAN) {
          status.textContent = 'You win! 🎉';
          scores.X++;
          document.getElementById('score-x').textContent = scores.X;
        } else {
          status.textContent = 'AI wins! 🐸';
          scores.O++;
          document.getElementById('score-o').textContent = scores.O;
        }
      }
    }

    function aiTurn() {
      if (gameOver) return;
      stopTimer();
      status.textContent = 'AI is thinking… 🐸';
      setTimeout(() => {
        const move = bestMove(board);
        board[move] = AI;
        renderBoard(move);
        const result = checkWinner(board);
        if (result) { endGame(result); return; }
        status.textContent = 'Your turn — pick a square 🍦';
        startTimer();
      }, 350);
    }

    function handleClick(e) {
      const i = +e.currentTarget.dataset.index;
      if (gameOver || board[i]) return;
      board[i] = HUMAN;
      renderBoard(i);
      const result = checkWinner(board);
      if (result) { endGame(result); return; }
      aiTurn();
    }

    function startGame() {
      board = Array(9).fill(null);
      gameOver = false;
      renderBoard();
      stopTimer();
      if (humanGoesFirst) {
        status.textContent = 'Your turn — pick a square 🍦';
        startTimer();
      } else {
        status.textContent = 'AI goes first… 🐸';
        aiTurn();
      }
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    document.getElementById('btn-restart').addEventListener('click', startGame);
    btnToggle.addEventListener('click', () => {
      humanGoesFirst = !humanGoesFirst;
      btnToggle.textContent = humanGoesFirst ? 'Go Second' : 'Go First';
      startGame();
    });

    startGame();
  </script>
</body>
</html>
